<div class="return-page">

  <section class="return-card">

    <p class="eyebrow">PAYMENT STATUS</p>

    @if (loading) {

      <div class="loader">
        <div class="spinner"></div>
      </div>

      <h1>Verifying payment</h1>

      <p>
        {{ message }}
      </p>

    } @else {

      @if (payment?.status === 'PAID') {

        <div class="icon success-icon">
          ✓
        </div>

        <h1>Payment successful</h1>

        <p>
          {{ message }}
        </p>

        @if (payment?.amount) {
          <strong class="amount">
            {{ payment?.amount | number:'1.2-2' }}
            {{ payment?.currency }}
          </strong>
        }

      } @else {

        <div class="icon pending-icon">
          !
        </div>

        <h1>Payment status</h1>

        <p>
          {{ message }}
        </p>

      }

    }


    <button
      type="button"
      class="primary"
      (click)="goDashboard()">
      Return to dashboard
    </button>

  </section>

</div>
