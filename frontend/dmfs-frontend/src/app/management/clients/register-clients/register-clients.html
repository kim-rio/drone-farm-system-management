<div class="page">

  <div class="page-header">

    <div>
      <h1>Register Client</h1>

      <p>
        Register a company or individual client.
      </p>
    </div>

    <button
      type="button"
      class="secondary"
      (click)="cancel()"
      [disabled]="loading()">

      Back to Clients

    </button>

  </div>

  <div class="form-card">

    <div class="type-selector">

      <button
        type="button"
        [class.selected]="client.type === 'INDIVIDUAL'"
        (click)="setType('INDIVIDUAL')">

        <strong>Individual</strong>

        <span>
          Register a person as the client.
        </span>

      </button>

      <button
        type="button"
        [class.selected]="client.type === 'COMPANY'"
        (click)="setType('COMPANY')">

        <strong>Company</strong>

        <span>
          Register an organization as the client.
        </span>

      </button>

    </div>

    @if (errorMessage()) {

      <div class="form-error">
        {{ errorMessage() }}
      </div>

    }

    @if (successMessage()) {

      <div class="form-success">
        {{ successMessage() }}
      </div>

    }

    <form
      #form="ngForm"
      (ngSubmit)="register()">

      @if (client.type === 'COMPANY') {

        <div class="section">

          <h2>Company Information</h2>

          <div class="form-group">

            <label for="companyName">
              Company Name *
            </label>

            <input
              id="companyName"
              name="companyName"
              type="text"
              [(ngModel)]="client.companyName"
              required>

          </div>

          <div class="form-row">

            <div class="form-group">

              <label for="registrationNumber">
                Registration Number
              </label>

              <input
                id="registrationNumber"
                name="registrationNumber"
                type="text"
                [(ngModel)]="client.registrationNumber">

            </div>

            <div class="form-group">

              <label for="tin">
                TIN
              </label>

              <input
                id="tin"
                name="tin"
                type="text"
                [(ngModel)]="client.tin">

            </div>

          </div>

        </div>

      } @else {

        <div class="section">

          <h2>Individual Information</h2>

          <div class="form-row">

            <div class="form-group">

              <label for="firstName">
                First Name *
              </label>

              <input
                id="firstName"
                name="firstName"
                type="text"
                [(ngModel)]="client.firstName"
                required>

            </div>

            <div class="form-group">

              <label for="lastName">
                Last Name *
              </label>

              <input
                id="lastName"
                name="lastName"
                type="text"
                [(ngModel)]="client.lastName"
                required>

            </div>

          </div>

        </div>

      }

      <div class="section">

        <h2>Contact Information</h2>

        <div class="form-row">

          <div class="form-group">

            <label for="email">
              {{ client.type === 'COMPANY'
                ? 'Company Email *'
                : 'Individual Email *' }}
            </label>

            <input
              id="email"
              name="email"
              type="email"
              [(ngModel)]="client.email"
              required>

          </div>

          <div class="form-group">

            <label for="phone">
              {{ client.type === 'COMPANY'
                ? 'Company Phone *'
                : 'Individual Phone *' }}
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"
              [(ngModel)]="client.phone"
              required>

          </div>

        </div>

        <div class="form-group">

          <label for="address">
            Address
          </label>

          <textarea
            id="address"
            name="address"
            rows="3"
            [(ngModel)]="client.address">
          </textarea>

        </div>

      </div>

      <div class="form-actions">

        <button
          type="button"
          class="secondary"
          (click)="cancel()"
          [disabled]="loading()">

          Cancel

        </button>

        <button
          type="submit"
          class="primary"
          [disabled]="loading() || !form.valid">

          @if (loading()) {
            Registering...
          } @else {
            Register Client
          }

        </button>

      </div>

    </form>

  </div>

</div>
