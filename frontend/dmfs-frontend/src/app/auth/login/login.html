<div class="login-page">

  <div class="login-container">

    <div class="brand">
      <h1>DMFS</h1>
      <p>Drone Farm Management System</p>
    </div>

    <div class="login-header">
      <h2>Welcome back</h2>
      <p>Sign in to access your account</p>
    </div>

    <form class="login-form" (ngSubmit)="login()">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      @if (errorMessage) {
        <div class="error">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading">

        @if (loading) {
          Signing in...
        } @else {
          Sign in
        }

      </button>

    </form>

    <div class="login-footer">
      <span>Drone Farm Management System</span>
    </div>

  </div>

</div>
