<div class="login-page">

  <section class="login-panel">

    <div class="login-content">

      <div class="brand">

        @if (branding) {

          <div class="brand-logo">

            @if (branding.logoUrl) {

              <img
                [src]="branding.logoUrl"
                [alt]="branding.companyName + ' logo'"
              />

            } @else {

              <span class="brand-logo-mark">
                {{ branding.companyName.charAt(0).toUpperCase() }}
              </span>

            }

          </div>

          <div class="brand-name">
            {{ branding.companyName }}
          </div>

        }

      </div>

      <div class="login-header">

        <h1>
          Welcome back
        </h1>

      </div>

      @if (errorMessage) {

        <div class="error">
          {{ errorMessage }}
        </div>

      }

      <form
        class="login-form"
        (ngSubmit)="login()"
      >

        <div class="form-group">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

        </div>

        <button
          type="submit"
          [disabled]="loading"
        >

          @if (loading) {
            Signing in...
          } @else {
            Sign in
          }

        </button>

      </form>

    </div>

  </section>

  <section class="visual-panel">

    <div class="world-stage">

      <div class="ambient-ring ambient-ring-one"></div>
      <div class="ambient-ring ambient-ring-two"></div>

      <div class="globe">

        <div class="globe-latitude latitude-one"></div>
        <div class="globe-latitude latitude-two"></div>
        <div class="globe-latitude latitude-three"></div>

        <div class="globe-longitude longitude-one"></div>
        <div class="globe-longitude longitude-two"></div>
        <div class="globe-longitude longitude-three"></div>

        <div class="continent continent-one"></div>
        <div class="continent continent-two"></div>
        <div class="continent continent-three"></div>

        <div class="location-point point-one"></div>
        <div class="location-point point-two"></div>
        <div class="location-point point-three"></div>

      </div>

      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>

    </div>

  </section>

</div>
