spring.application.name=dmfs-backend

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/dmfs
spring.datasource.username=dmfs
spring.datasource.password=dmfs
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true