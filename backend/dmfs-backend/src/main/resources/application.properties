spring.application.name=dmfs-backend

server.port=8080

# PostgreSQL
spring.datasource.url=${DMFS_DB_URL:jdbc:postgresql://localhost:5432/dmfs}
spring.datasource.username=${DMFS_DB_USERNAME:dmfs}
spring.datasource.password=${DMFS_DB_PASSWORD:dmfs}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
# JWT
app.jwt.secret=16f68b4c799c19198bfd6e2e78853ea7
app.jwt.expiration=86400000
app.storage.path=uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
